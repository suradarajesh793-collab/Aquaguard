const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`,simTag=()=>S.sim?tag("Manual simulation","sim"):tag("Simulated stream · no hardware connected","sim");

<div class="c" style="margin-bottom:14px"><h3>Live system flow</h3>${sysDiagram()}</div><div class="g">${m("Greywater collected",f(t.coll*fac()*(k/fac()>1?1:1)/(S.range=="Day"?30:1)*(S.range=="Day"?1:S.range=="Week"?7/30*1:1)),"litres, "+S.range.toLowerCase())}${m("Water treated",f(t.tr*fac()/(S.range=="Day"?30:S.range=="Week"?30/7:1)),"litres")}${m("Water reused",f(t.re*fac()/(S.range=="Day"?30:S.range=="Week"?30/7:1)),"litres")}${m("In storage",f(S.sec*40+t.st/20),"litres")}${m("Active units",S.units.filter(u=>u.st!="Offline").length+"/"+S.units.length)}${m("Need maintenance",S.units.filter(u=>u.m=="Overdue"||u.st=="Offline").length)}${m("System health",tag(health(),SC[health()]))}${m("Flood risk",tag(floodRisk(),floodRisk()=="Low"?"ok":floodRisk()=="High"?"crit":"warn"),"Rain "+f(S.rain)+" mm/h")}</div>

<div class="c"><h3>Active alerts</h3>${S.alerts.filter(a=>a.st!="resolved").slice(0,4).map(a=>`<div>${tag(a.sev=="crit"?"Critical":"Warning",a.sev)} ${a.cat} · ${a.unit}</div>`).join("")||`<p class="m">No active alerts. The system is operating normally.</p>`}</div><div class="c"><h3>Recent activity</h3>${S.log.slice(0,5).map(l=>`<div class="m">${l.t} — ${l.m}</div>`).join("")||`<p class="m">No events yet. Start a simulation to generate activity.</p>`}</div></div>`},
mon(){const sl=(k,l,mx,st)=>`<div><label class="m">${l}: <b id="v_${k}">${f(S[k],st<1?1:0)}</b></label><br><input type="range" min="0" max="${mx}" step="${st}" value="${S[k]}" oninput="$('#v_${k}').textContent=this.value" onchange="S.${k}=+this.value;render()"></div>`;
return`<div class="row" style="margin-bottom:12px">${simTag()}<label><input type="checkbox" ${S.sim?"checked":""} onchange="S.sim=this.checked;log(S.sim?'Manual simulation mode on':'Simulated stream resumed');render()"> Manual simulation mode</label></div>
<div class="g">${tank(S.primary,"Collection tank")}${tank(S.sec,"Secondary storage")}${tank(S.emg,"Emergency storage")}${tank(S.filt[2],"Biofilter health")}</div><div class="g" style="margin-top:14px">${gauge(S.flow,20,"Inflow rate","L/min",T.flow)}${gauge(S.primary,100,"Collection tank","% full",T.warn)}${gauge(S.sec,100,"Secondary storage","% full",T.warn)}${gauge(S.turb,100,"Turbidity","NTU",T.turb)}${gauge(S.flow*.93,20,"Outlet flow","L/min")}</div>
<div class="g2"><div class="c"><h3>Tank level trend</h3>${line(S.hist,"var(--pri)",0,100)}</div><div class="c"><h3>Treatment status</h3><p>${tag(S.pump?"Running":"Pump off",S.pump?"ok":"off")} Primary tank ${f(S.primary)}% · Secondary ${f(S.sec)}%</p><div class="bar"><i style="width:${S.primary}%"></i></div><p class="m">Data source: simulated. Hardware endpoint: <code>POST /api/v1/readings</code> or MQTT <code>aquaguard/{unit}/telemetry</code> (not connected).</p></div>
${S.sim?`<div class="c"><h3>Simulation controls</h3>${sl("primary","Collection tank %",100,1)}${sl("sec","Secondary storage %",100,1)}${sl("flow","Inflow L/min",20,.5)}${sl("turb","Turbidity NTU",100,1)}</div>`:`<div class="c"><h3>Simulation controls</h3><p class="m">Turn on manual simulation mode to set sensor values yourself and watch alerts and diversion react.</p></div>`}</div>`},
treat(){const n=["Wastewater collection","Pre-filtration","Grease and silt separation","Vertical biofilter","Biological treatment","Quality verification","Treated storage","Reuse or safe disposal"],q=S.flow*60;
return`<div class="note">Filtration and turbidity readings alone do not establish that water is safe. Reuse requires laboratory verification against the applicable standard.</div><div class="c" style="margin-bottom:14px">${sysDiagram()}</div><div class="st">${n.map((x,i)=>{const fl=S.filt[i]??null,low=fl!==null&&fl<60,out=q*(1-i*.02);return`<div class="c stg ${low?"":"act"}"><b>${i+1}. ${x}</b><p class="m">In ${f(q*(1-(i?i-1:0)*.02))} L/h<br>Out ${f(out)} L/h</p>${tag(low?"Maintenance due":"Operating",low?"warn":"ok")}${fl!==null?`<p class="m">Filter condition ${f(fl)}%</p><div class="bar"><i style="width:${fl}%;background:${low?"var(--warn)":"var(--pri)"}"></i></div>`:`<p class="m">Progress</p><div class="bar"><i class="pulse" style="width:${70+i*3}%"></i></div>`}</div>${i<7?`<div style="align-self:center;color:var(--pri)">➜</div>`:""}`}).join("")}</div>
<div class="c" style="margin-top:14px"><h3>Filter actions</h3><div class="row">${["Pre-filter","Grease trap","Biofilter","Bio media","Polishing"].map((x,i)=>`<button class="b2" onclick="S.filt[${i}]=98;log('${x} cleaned (simulated)');render()">Clean ${x}</button>`).join("")}</div></div>`},
over(){return`<div class="g"><div class="c"><h3>Primary soak-pit</h3><div class="big">${f(S.primary)}%</div><div class="bar"><i style="width:${S.primary}%"></i></div>${tag(S.primary>=T.warn?"Over limit":"Within limit",S.primary>=T.warn?"warn":"ok")}</div><div class="c"><h3>Secondary soak-pit</h3><div class="big">${f(S.sec)}%</div><div class="bar"><i style="width:${S.sec}%"></i></div></div><div class="c"><h3>Emergency storage</h3><div class="big">${f(S.emg)}%</div><div class="bar"><i style="width:${S.emg}%"></i></div></div><div class="c"><h3>Pump and valve</h3><p>Pump ${tag(S.pump?"ON":"OFF",S.pump?"ok":"off")}<br>Valve: <b>${S.valve}</b><br>Mode: ${S.mode}</p></div></div>
<div class="g2"><div class="c"><h3>Thresholds</h3><div class="row"><label>Warning % <input type="number" style="width:80px" value="${T.warn}" onchange="T.warn=+this.value"></label><label>Critical % <input type="number" style="width:80px" value="${T.crit}" onchange="T.crit=+this.value"></label></div><p class="m">At the warning level the system checks secondary storage, diverts if there is space, updates the dashboard and records the event. If secondary storage is full it raises a critical alert and blocks discharge.</p><button class="b r" onclick="ask('Manual override moves flow to emergency storage only. Untreated discharge is never allowed. Continue?',()=>{S.diverting=true;S.valve='Manual divert to emergency storage';S.emg=clamp(S.emg+10,0,100);log('Manual override: diverting to emergency storage');S.ov.unshift({t:new Date().toLocaleString(),m:'Manual override to emergency storage'})})">Manual override</button> <button class="b2" onclick="S.primary=88;S.sim=true;render()">Simulate 88% fill</button></div><div class="c"><h3>Overflow history</h3>${S.ov.map(o=>`<div class="m">${o.t} — ${o.m}</div>`).join("")}</div></div>`},
flood(){const F=S.flood;return`<div class="c" style="margin-bottom:14px;overflow:hidden">${floodScene()}</div><div class="g"><div class="c"><h3>External water level</h3><div class="big">${f(S.ext)}%</div><div class="bar"><i style="width:${S.ext}%"></i></div></div><div class="c"><h3>Rainfall</h3><div class="big">${f(S.rain)} mm/h</div></div><div class="c"><h3>Drainage</h3><div class="big">${f(S.drain)}%</div>${tag(S.drain>40?"Available":"Limited",S.drain>40?"ok":"warn")}</div><div class="c"><h3>Protection</h3><p>Risk ${tag(floodRisk(),floodRisk()=="Low"?"ok":"crit")}<br>Non-return valve: <b>${S.nrv?"Closed":"Open"}</b><br>Emergency storage: <b>${S.emerg?"Active":"Standby"}</b><br>Bypass: <b>Locked closed</b></p></div></div>
<div class="row" style="margin:14px 0">${F?`<button class="b2" onclick="S.flood=null;S.fstep=0;S.nrv=false;S.emerg=false;S.ext=8;S.rain=2;S.valve='Normal';log('Flood simulation ended, system restored');render()">End simulation</button>`:`<button class="b r" onclick="ask('Start the flood simulation? External water will rise and protection steps will run.',()=>{S.flood={};log('Flood simulation started')})">Start flood simulation</button>`}${tag("Simulated","sim")}</div>
<div class="g2"><div class="c"><h3>Emergency operation log</h3>${S.log.filter(l=>/flood|Flood|FLOOD|Drainage|Non-return|Emergency/.test(l.m)).map(l=>`<div class="m">${l.t} — ${l.m}</div>`).join("")||`<p class="m">No flood operations yet.</p>`}</div><div class="c"><h3>Flood event history</h3>${S.fl.map(o=>`<div class="m">${o.t} — ${o.m}</div>`).join("")}</div></div>`},
ai(){const n=S.hist.slice(-10),sl=(n[9]-n[0])/9,eta=sl>.05?Math.max(0,(T.warn-S.primary)/sl*2/60):null,jump=Math.max(...S.hist.slice(-12).map((v,i,a)=>i?Math.abs(v-a[i-1]):0)),fc=[1,1.05,.95,1,1.1,1.25,1.15].map(x=>Math.round(S.units[0].gen*x));
return`<div class="note">Rule-based estimates on simulated and sample history. These are not verified machine-learning predictions.</div><div class="g2"><div class="c"><h3>Overflow risk</h3><div class="big">${S.primary>=T.warn?"High":eta!==null&&eta<30?"Elevated":"Low"}</div><p>${eta!==null?`Rising ${f(sl,2)}%/step; limit in about ${f(eta,1)} min.`:"Level steady or falling."}</p><p class="m">Why: the slope of the last 10 readings is projected to the ${T.warn}% limit.</p></div>
<div class="c"><h3>Predictive maintenance</h3>${S.filt.slice(0,3).map((v,i)=>`<div>${["Pre-filter","Grease trap","Biofilter"][i]}: ${tag(v<60?"Service soon":"Healthy",v<60?"warn":"ok")} ${f(v)}%</div>`).join("")}<p class="m">Why: condition below 60% flags blockage risk, mainly when outflow is low while the tank is rising.</p></div>
<div class="c"><h3>Usage forecast (L/day, next 7 days)</h3>${bars(fc,["M","T","W","T","F","S","S"],"var(--ok)")}<p class="m">Why: recent daily average × weekday pattern, with higher weekend use.</p></div>
<div class="c"><h3>Anomaly detection</h3><p>${jump>6?tag("Sudden level change","warn")+" Largest step "+f(jump,1)+"%. Possible sensor fault or burst inflow.":tag("No anomalies","ok")+" Level changes are within the expected range."}</p></div>
<div class="c" style="grid-column:1/-1"><h3>Recommendations</h3><ul><li>${S.filt[0]<60?"Clean the pre-filter. Condition is "+f(S.filt[0])+"%.":"Pre-filter is healthy; next check in 2 weeks."}</li><li>Check secondary storage${S.sec>70?" (now "+f(S.sec)+"% full)":""}: it is the first line of overflow defence.</li><li>Inspect the diversion valve${S.diverting?" — it is active now":" at the next visit"}.</li><li>Inspect the drainage pipe before the monsoon, and schedule treatment-unit maintenance for TU-104.</li></ul></div></div>`},
qual(){const r=[["Turbidity",S.turb,"NTU",0,T.turb],["pH",S.ph,"",T.phLo,T.phHi],["Temperature",S.temp,"°C",15,35],["Conductivity",S.ec,"µS/cm",0,T.ec],["Flow",S.flow,"L/min",0,T.flow]];
return`<div class="note">These are sensor-based indicators. Safety for reuse must be verified by a laboratory test. Lab status: <b>No sample on record</b>.</div><div class="g">${r.map(x=>{const bad=x[1]<x[3]||x[1]>x[4];return`<div class="c"><div class="m">${x[0]}</div><div class="big">${f(x[1],x[0]=="pH"||x[0]=="Flow"?1:0)} <small class="m">${x[2]}</small></div>${tag(bad?"Abnormal":"In range",bad?"crit":"ok")}<div class="m">Range ${x[3]}–${x[4]}</div></div>`}).join("")}</div><div class="g2"><div class="c"><h3>Turbidity trend</h3>${line(S.tq,"var(--pri)",0,100)}</div><div class="c"><h3>Thresholds</h3><p class="m">Administrators set limits for the intended reuse (for example garden irrigation) in Settings, following the applicable local standard.</p><button class="b2" onclick="go('set')">Open thresholds</button></div></div>`},
inst(){const q=(S.q||"").toLowerCase(),sf=S.sf||"All",L=S.units.filter(u=>(sf=="All"||u.st==sf)&&(u.name+u.id+u.loc).toLowerCase().includes(q));
return`<div class="row" style="margin-bottom:12px"><input placeholder="Search installations" value="${S.q||""}" oninput="S.q=this.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{const p=this.selectionStart;render();const e=$('#qs');e.focus();e.setSelectionRange(p,p)},250)" id="qs"><select onchange="S.sf=this.value;render()">${["All","Normal","Warning","Critical","Offline"].map(x=>`<option ${sf==x?"selected":""}>${x}</option>`).join("")}</select><button class="b" onclick="uf()">Add installation</button></div>
<div class="c sc"><table><tr><th>ID<th>Name<th>Type<th>Location<th>Daily L<th>Reuse L<th>Tank<th>Status<th>Maintenance<th></tr>${L.map(u=>`<tr><td>${u.id}<td>${u.name}<td>${u.type}<td>${u.loc}<td>${u.gen}<td>${u.reuse}<td>${u.tank}%<td>${tag(u.st,SC[u.st])}<td>${u.m}<td><button class="b2" onclick="uf('${u.id}')">Edit</button></tr>`).join("")||`<tr><td colspan="10" class="m">No installations match. Clear the search or add one.</td></tr>`}</table></div>
<div class="g2"><div class="c"><h3>Community summary</h3><p>Households connected: ${S.units.filter(u=>u.type=="Household").length}<br>Community capacity: 6,000 L/day<br>Total collected today: ${S.units.reduce((a,u)=>a+u.gen,0)} L<br>Overflow incidents: ${S.ov.length}<br>Flood alerts: ${S.alerts.filter(a=>a.cat=="Flood detected").length}</p></div></div>`},
map(){const sel=S.units.find(u=>u.id==S.sel);return`<div class="c"><svg viewBox="0 0 100 80" style="width:100%;max-height:480px;background:var(--bg);border-radius:10px"><path d="M0 62 Q30 52 55 64 T100 56" stroke="#2d6fb8" stroke-width="3" fill="none" opacity=".5"/><polygon points="55,60 85,58 90,76 50,76" fill="#2d6fb8" opacity=".18"/><text x="58" y="72" font-size="3" fill="var(--mut)">Flood-prone area (sample)</text><path d="M22 30 L30 42 L45 70 M62 35 L70 55 L45 70 M30 42 L62 35" stroke="var(--pri)" stroke-width=".6" stroke-dasharray="2 1" fill="none"/>${S.units.map(u=>`<g onclick="S.sel='${u.id}';render()" style="cursor:pointer"><circle cx="${u.x}" cy="${u.y*0.95}" r="${u.type=="Community"?3.4:2.4}" fill="var(--${SC[u.st]=="off"?"off":SC[u.st]})" stroke="#fff" stroke-width=".6"/><text x="${u.x+3}" y="${u.y*0.95+1}" font-size="2.6" fill="var(--ink)">${u.id}</text></g>`).join("")}</svg>
<div class="row m"><span>${tag("Normal","ok")} ${tag("Warning","warn")} ${tag("Critical","crit")} ${tag("Offline","off")}</span><span>Dashed lines: drainage network. Simulated map with sample coordinates; ready for lat/lng and Leaflet tiles.</span></div>${sel?`<p><b>${sel.id} ${sel.name}</b> · ${sel.loc} · tank ${sel.tank}% · ${tag(sel.st,SC[sel.st])}</p>`:`<p class="m">Select a marker for details.</p>`}</div>`},
impact(){const t=S.tot,k={Daily:1/30,Weekly:7/30,Monthly:1,Annual:12}[S.rp||"Monthly"];return`<div class="note">Benefits are estimates calculated from recorded system data, not independently measured.</div><div class="row" style="margin-bottom:12px"><select onchange="S.rp=this.value;render()">${["Daily","Weekly","Monthly","Annual"].map(x=>`<option ${(S.rp||"Monthly")==x?"selected":""}>${x}</option>`).join("")}</select><button class="b" onclick="csv()">Download CSV</button><button class="b2" onclick="print()">Print or save PDF</button></div><div class="g"><div class="c"><div class="m">Greywater treated</div><div class="big">${f(t.tr*k)} L</div></div><div class="c"><div class="m">Freshwater demand potentially avoided</div><div class="big">${f(t.re*k)} L</div></div><div class="c"><div class="m">Overflow incidents prevented (est.)</div><div class="big">${f(S.ov.length*3*k+1)}</div></div><div class="c"><div class="m">Reuse rate</div><div class="big">${f(t.re/t.tr*100)}%</div></div></div><div class="c" style="margin-top:14px"><h3>Treated vs reused (kL)</h3>${bars([38,41,43,44,47,49],["Jun","Jul","Aug","Sep","Oct","Nov"])}</div>`},
alerts(){const fl=S.af||"open",L=S.alerts.filter(a=>fl=="all"||(fl=="open"?a.st!="resolved":a.st=="resolved"));return`<div class="row" style="margin-bottom:12px">${[["open","Active"],["resolved","History"],["all","All"]].map(x=>`<button class="${fl==x[0]?"b":"b2"}" onclick="S.af='${x[0]}';render()">${x[1]}</button>`).join("")}</div>${L.map(a=>`<div class="c" style="margin-bottom:10px">${tag(a.sev=="crit"?"Critical":"Warning",a.sev)} <b>${a.cat}</b> · ${a.unit} <span class="m">${a.t} · ${a.st}</span><p>${a.msg}</p><p class="m">Recommended: ${a.act}</p>${a.st=="open"?`<button class="b2" onclick="ak(${a.id},'ack')">Acknowledge</button> `:""}${a.st!="resolved"?`<button class="b" onclick="ak(${a.id},'resolved')">Resolve</button>`:""}</div>`).join("")||`<p class="m">No alerts in this view.</p>`}`},
maint(){return`<div class="c sc"><table><tr><th>Task<th>Unit<th>Due<th>Technician<th>Status<th></tr>${S.maint.map(m=>`<tr><td>${m.task}<td>${m.unit}<td>${m.due}<td><select onchange="S.maint[${m.id-1}].who=this.value">${["Unassigned","R. Kumar","S. Devi"].map(x=>`<option ${m.who==x?"selected":""}>${x}</option>`).join("")}</select><td>${tag(m.done?"Done":m.due=="Overdue"?"Overdue":"Scheduled",m.done?"ok":m.due=="Overdue"?"crit":"warn")}<td>${m.done?"":`<button class="b" onclick="S.maint[${m.id-1}].done=true;log('Maintenance done: ${m.task}');render()">Mark done</button>`}</tr>`).join("")}</table></div><p class="m">Reminders use operating hours and observed conditions, for example a filter below 60% moves its cleaning task to overdue.</p>`},
ctrl(){const lock=S.flood&&S.emerg,B=(l,fn,d)=>`<button class="b2" ${d?"disabled":""} onclick="ask('${l}?',()=>{${fn}})">${l}</button>`;return`<div class="note">Hardware-level emergency protection is armed and cannot be overridden by software. All operations here are simulated. ${tag("Simulated","sim")}</div><div class="g"><div class="c"><h3>Pump</h3>${tag(S.pump?"ON":"OFF",S.pump?"ok":"off")}<p>${B(S.pump?"Turn pump OFF":"Turn pump ON",`S.pump=!S.pump;log('Pump '+(S.pump?'ON':'OFF')+' (simulated)')`,lock)}</p></div><div class="c"><h3>Diversion valve</h3><b>${S.valve}</b><p>${B("Open diversion to secondary",`S.diverting=true;S.valve='Diverting to secondary';log('Diversion opened manually')`,S.sec>=T.crit||lock)}${B("Close diversion",`S.diverting=false;S.valve='Normal';log('Diversion closed')`,lock)}</p><p class="m">Interlock: blocked when secondary is over ${T.crit}% or protection mode is active.</p></div><div class="c"><h3>Operation mode</h3><b>${S.mode}</b><p>${B("Switch to "+(S.mode=="auto"?"manual":"automatic"),`S.mode=S.mode=='auto'?'manual':'auto';log('Mode: '+S.mode)`)}</p></div><div class="c"><h3>Emergency and flood</h3><p>${B(S.emerg?"Exit emergency mode":"Activate emergency mode",`S.emerg=!S.emerg;S.valve=S.emerg?'Closed (interlock)':'Normal';log('Emergency mode '+(S.emerg?'on':'off'))`)}${B("Activate flood protection",`S.nrv=true;S.emerg=true;S.valve='Closed (interlock)';log('Flood protection activated manually')`,S.nrv)}</p></div><div class="c"><h3>Tank switching</h3><p>${B("Switch to secondary tank",`S.diverting=true;S.valve='Diverting to secondary';log('Tank switched to secondary')`,S.sec>=T.crit||lock)}</p></div></div><div class="c" style="margin-top:14px"><h3>Command log</h3>${S.log.slice(0,8).map(l=>`<div class="m">${l.t} — ${l.m}</div>`).join("")||`<p class="m">No commands sent yet.</p>`}</div>`},
set(){return`<div class="g2"><div class="c"><h3>Alert thresholds</h3>${[["warn","Tank warning %"],["crit","Tank critical %"],["turb","Turbidity NTU"],["phLo","pH min"],["phHi","pH max"],["flow","Flow L/min"],["ec","Conductivity µS/cm"]].map(x=>`<p><label>${x[1]} <input type="number" step="any" style="width:90px" value="${T[x[0]]}" onchange="T['${x[0]}']=+this.value"></label></p>`).join("")}</div><div class="c"><h3>Users and roles</h3>${Object.entries(ROLES).map(([k,v])=>`<div>${v} ${tag(NAV.filter(n=>n[2].includes(k)).length+" pages","off")}</div>`).join("")}<h3 style="margin-top:14px">Theme</h3><button class="b2" onclick="S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;render()">Switch to ${S.theme=="dark"?"light":"dark"} mode</button></div><div class="c"><h3>API and devices</h3><p class="m">Telemetry: <code>POST /api/v1/readings</code> · MQTT <code>aquaguard/{unit}/telemetry</code><br>Commands: <code>aquaguard/{unit}/cmd</code><br>Status: ${tag("No device connected","off")}</p><div class="row"><input id="dev" placeholder="ESP32 device ID"><button class="b" onclick="const v=$('#dev').value.trim();if(v){log('Device registered: '+v);$('#dev').value='';alert2('Registered '+v)}">Register device</button></div></div></div>`}};
function alert2(m){S.modal=`<h3>${m}</h3><button class="b" onclick="cm()">OK</button>`;render()}
function ak(id,st){const a=S.alerts.find(x=>x.id==id);a.st=st;log("Alert "+st+": "+a.cat);render()}
function csv(){const t=S.tot,r="metric,litres\ncollected,"+t.coll+"\ntreated,"+t.tr+"\nreused,"+t.re+"\nstored,"+t.st+"\nsource,simulated sample data";S.modal=`<h3>CSV report</h3><textarea style="width:100%;height:150px">${r}</textarea><p class="m">Select and copy. Direct file download may be blocked on a hosted preview.</p><button class="b" onclick="cm()">Close</button>`;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r],{type:"text/csv"}));a.download="aquaguard-report.csv";a.click()}catch(e){}render()}
function uf(id){const u=S.units.find(x=>x.id==id)||{id:"TU-"+(106+S.units.length-5),name:"",type:"Household",loc:"",gen:300,reuse:0,tank:0,st:"Normal",m:"OK",x:50,y:50};S.eu=u;S.new=!id;S.modal=`<h3>${id?"Edit":"Add"} installation</h3><div style="display:grid;gap:8px"><input id="f1" placeholder="Name" value="${u.name}"><input id="f2" placeholder="Location" value="${u.loc}"><select id="f3">${["Household","Community"].map(x=>`<option ${u.type==x?"selected":""}>${x}</option>`).join("")}</select><select id="f5">${Object.keys(SC).map(x=>`<option ${u.st==x?"selected":""}>${x}</option>`).join("")}</select><input id="f4" type="number" placeholder="Daily litres" value="${u.gen}"></div><p class="m" id="er" style="color:var(--crit)"></p><div class="row"><button class="b2" onclick="cm()">Cancel</button><button class="b" onclick="us()">Save</button></div>`;render()}
function us(){const n=$("#f1").value.trim();if(!n){$("#er").textContent="Enter a name for the installation.";return}const u=S.eu;Object.assign(u,{name:n,loc:$("#f2").value,type:$("#f3").value,st:$("#f5").value,gen:+$("#f4").value});if(S.new)S.units.push(u);log((S.new?"Added ":"Updated ")+u.id);cm()}
function auth(){const m=S.auth;return`<div class="lg"><div class="c"><h1>💧 Project K</h1><p class="m">Smart greywater and flood-resilient monitoring</p>${m=="forgot"?`<input placeholder="Email"><button class="b" onclick="alert2('If the account exists, a reset link would be sent (demo)')">Send reset link</button>`:`${m=="reg"?`<input placeholder="Full name">`:""}<input placeholder="Email" value="demo@aquaguard.app"><input type="password" placeholder="Password" value="demo1234"><select id="rl">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="b" style="width:100%" onclick="S.user={name:'Demo user',r:$('#rl').value};S.page=NAV.find(n=>n[2].includes(S.user.r))[0];render();setInterval(tick,2000)">${m=="reg"?"Create account":"Sign in"}</button>`}<p class="m"><a href="#" onclick="S.auth='${m=="in"?"reg":"in"}';render();return false">${m=="in"?"Create an account":"Back to sign in"}</a> · <a href="#" onclick="S.auth='forgot';render();return false">Forgot password</a></p><p class="m">Demo sign-in only. Production auth is planned with Supabase.</p></div></div>${S.modal?`<div class="mod"><div>${S.modal}</div></div>`:""}`}
function render(){const R=$("#root");if(!S.user){R.innerHTML=auth();return}const r=S.user.r,items=NAV.filter(n=>n[2].includes(r)),cur=items.find(n=>n[0]==S.page)||items[0];
R.innerHTML=`<div class="app"><aside><b>💧 Project K</b>${items.map(n=>`<a class="${n[0]==cur[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</a>`).join("")}</aside><main><div class="top"><h1>${cur[1]}</h1><div class="row">${tag(health(),SC[health()])}<span class="m">${ROLES[r]}</span><button class="b2" onclick="S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;render()">${S.theme=="dark"?"Light":"Dark"}</button><button class="b2" onclick="location.reload()">Sign out</button></div></div>${P[cur[0]]()}</main></div>${S.modal?`<div class="mod"><div>${S.modal}</div></div>`:""}`}
render();
</script></body></html>
